<h1>動画自動アップロード</h1>
<p>本アプリは、個人が運用するYouTubeチャンネルへ、自作の解説動画を自動アップロードするための個人用ツールです。</p>

<h2>主な機能</h2>
<ul>
  <li>自作動画ファイル(MP4)のアップロード</li>
  <li>タイトル・説明文・タグの自動設定</li>
  <li>サムネイル画像の設定</li>
</ul>

<h2>本アプリが利用するサービス</h2>
<p>本アプリは <strong>YouTube API Services</strong> を利用しています。利用にあたり、
<a href="https://www.youtube.com/t/terms">YouTube 利用規約</a> および
<a href="https://www.google.com/policies/privacy/">Google プライバシー ポリシー</a> が適用されます。</p>

<h2>プライバシー</h2>
